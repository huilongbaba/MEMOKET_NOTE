# 两道闸门，每次 push 和 PR 都跑一遍。
#
# 加这个文件的理由跟这一轮自查里反复出现的那条一样：**写了却不执行的检查
# 等于没写**。仓库里本来就有 649 条后端测试和十个前端检查脚本，全都通过，
# 但跑不跑全看有没有人记得。
#
# 两道闸门都不需要模型：后端的判据、循环、middleware、修订防线全靠打桩
# 驱动（真实模型只在 backend/scripts/ 的 bench 里用），前端是纯函数加类型
# 检查。所以 CI 跑得起来，也跑得快。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        # 沙箱那几条会自己跳过：ubuntu runner 上没有 bwrap，也没有
        # macOS 的 sandbox-exec。跳过是 tests/test_sandbox.py 里显式写的。
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 装依赖
        working-directory: frontend
        run: npm ci
      - name: tsc + vitest + 十个检查脚本
        working-directory: frontend
        run: npm test
